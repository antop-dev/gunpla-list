<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청 현황 - 건담 목록</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/favicon/android-icon-192x192.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/favicon/favicon-96x96.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon/favicon-16x16.png}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-grid.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-theme-alpine.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/css/all.min.css}">
    <th:block th:if="${not #strings.isEmpty(ga4)}">
        <script th:src="@{https://www.googletagmanager.com/gtag/js(id=${ga4})}" async="async"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', /*[[${ga4}]]*/ '');
        </script>
    </th:block>
    <!-- Google Tag Manager -->
    <th:block th:if="${not #strings.isEmpty(gtmId)}">
        <script th:inline="javascript">
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer',/*[[${gtmId}]]*/ '');
        </script>
    </th:block>
    <!-- End Google Tag Manager -->
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<th:block th:if="${not #strings.isEmpty(gtmId)}">
    <noscript>
        <iframe th:src="'https://www.googletagmanager.com/ns.html?id=' + ${gtmId}"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
</th:block>
<!-- End Google Tag Manager (noscript) -->

<script th:inline="javascript">
    window.CONTEXT_PATH = /*[[@{/}]]*/ '/';
</script>

<div class="user-layout">
    <header class="user-header">
        <div class="user-header-brand">
            <img th:src="@{/favicon/favicon-32x32.png}" alt="" width="20" height="20">
            <span class="user-header-title">요청 현황</span>
        </div>
        <div class="user-header-actions">
            <a th:href="@{/}" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-list"></i> 제품 목록
            </a>
            <!-- 로그인해야 들어올 수 있는 페이지라 프로필(로그아웃) 버튼은 항상 노출 -->
            <button class="btn-profile gtm-header-logout" id="btn-profile" title="로그아웃" aria-label="로그아웃">
                <img th:if="${userPicture != null}" th:src="${userPicture}" alt="profile">
                <i th:if="${userPicture == null}" class="fa-solid fa-user" style="font-size:14px"></i>
            </button>
        </div>
    </header>

    <main class="user-main">
        <div class="toolbar">
            <div class="toolbar-left">
                <select id="search-type" class="form-control search-select" aria-label="유형 필터">
                    <option value="">유형 전체</option>
                    <option value="REGISTER">등록</option>
                    <option value="MODIFY">수정</option>
                </select>
                <select id="search-status" class="form-control search-select" aria-label="상태 필터">
                    <option value="">상태 전체</option>
                    <option value="PENDING">대기</option>
                    <option value="APPROVED">승인</option>
                    <option value="REJECTED">반려</option>
                    <option value="CANCELED">취소</option>
                </select>
                <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm" title="새로고침" aria-label="새로고침">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <div class="grid-container">
            <div id="requests-grid" class="ag-theme-alpine-dark" style="width:100%;height:100%"></div>
        </div>
    </main>
</div>

<!-- Hidden logout form -->
<form id="form-logout" th:action="@{/logout}" method="post" style="display:none"></form>

<!-- 요청 상세 팝업 (읽기 전용) -->
<div id="modal-request-detail" class="modal-overlay">
    <div class="modal modal-req-detail">
        <div class="modal-header">
            <span id="modal-request-detail-title" class="modal-title">요청 상세</span>
            <button id="modal-request-detail-close" class="modal-close" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div id="request-detail-meta" class="req-meta"></div>
            <div id="request-detail-reject" class="req-reject" style="display:none"></div>
            <div id="request-detail-fields"></div>
        </div>
        <div class="modal-footer">
            <button id="btn-request-cancel" class="btn btn-danger" style="display:none">
                <i class="fa-solid fa-xmark"></i> 요청 취소
            </button>
            <button id="btn-request-detail-close" class="btn btn-secondary">닫기</button>
        </div>
    </div>
</div>

<!-- 제품 상세 팝업 — 요청 목록에서 제품명을 클릭하면 대상 제품의 현재 정보를 보여준다 -->
<div id="modal-product-detail" class="modal-overlay">
    <div class="modal" style="width:620px">
        <div class="modal-header">
            <span class="modal-title">제품 상세</span>
            <button id="modal-product-detail-close" class="modal-close" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div id="product-detail-fields"></div>
        </div>
        <div class="modal-footer">
            <button id="btn-product-detail-close" class="btn btn-secondary">닫기</button>
        </div>
    </div>
</div>

<script th:src="@{/vendor/ag-grid/ag-grid-community.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/product-request-fields.js}"></script>
<script th:src="@{/js/my-product-requests.js}"></script>
</body>
</html>

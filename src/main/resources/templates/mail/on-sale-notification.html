<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신규 판매제품 알림</title>
    <!--
      메일은 외부 CSS·폰트를 못 불러오는 클라이언트가 많다.
      · 앱 화면은 다크 테마지만 메일 클라이언트 호환을 위해 라이트 팔레트로 새로 짠다(supports 프로젝트의 처리완료 메일과 동일한 방식).
      · 카드로 감싸지 않고 본문 폭을 그대로 쓴다 — 제품 목록 행은 페이지 배경과 구분되도록 흰 배경 타일로 표시.
      · 본문 폭은 PC 에서는 최대 700px, 모바일에서는 뷰포트 전체 폭으로 반응형(mail-content 의 width="700" + max-width:100%
        조합이 미디어쿼리를 지원하지 않는 구형 클라이언트에서도 최소 700px 고정 폭으로는 보이게 해준다).
      · style 블록을 지우는 클라이언트가 있어 모든 규칙을 각 요소의 style 속성에도 넣어 둔다.
      · 레이아웃은 flex/grid 대신 table 로 짠다(구형 메일 클라이언트 호환).
    -->
    <style>
        body { margin: 0; padding: 0; background: #f0edf4; }
        a { color: #4a5cc4; }
        @media only screen and (max-width: 720px) {
            .mail-content { width: 100% !important; }
            .mail-pad { padding: 20px 16px !important; }
            .product-thumb { width: 56px !important; height: 56px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#f0edf4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f0edf4;">
    <tr>
        <td align="center" style="padding:28px 12px;">
            <table role="presentation" class="mail-content" width="700" cellpadding="0" cellspacing="0" border="0"
                   style="width:700px;max-width:100%;
                          font-family:'Roboto',system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
                          color:#1b1b1f;line-height:1.6;">
                <tr>
                    <td class="mail-pad" style="padding:0 12px;">

                        <!-- 안내 문구 -->
                        <p style="margin:0 0 4px;font-size:17px;font-weight:600;color:#1b1b1f;text-align:center;">
                            새로 판매중인 건프라 <span th:text="${#lists.size(products)}">3</span>종을 확인해보세요
                        </p>
                        <p style="margin:0 0 24px;font-size:13px;color:#46464f;text-align:center;">
                            판매제품 모아보기에서 수집한 신규 판매 시작 제품입니다.
                        </p>

                        <!-- 제품 목록 -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                               th:each="product : ${products}"
                               style="background:#ffffff;border:1px solid #c7c5d0;border-radius:10px;margin-bottom:10px;">
                            <tr>
                                <td width="70" style="padding:14px 0 14px 14px;vertical-align:top;">
                                    <a th:href="${product.url}" target="_blank">
                                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="product-thumb" alt=""
                                             width="64" height="64"
                                             style="width:64px;height:64px;object-fit:cover;border-radius:8px;background:#ffffff;border:1px solid #c7c5d0;display:block;">
                                        <table th:unless="${product.imageUrl}" role="presentation" width="64" height="64" cellpadding="0" cellspacing="0" border="0"
                                               style="width:64px;height:64px;background:#ffffff;border:1px solid #c7c5d0;border-radius:8px;">
                                            <tr>
                                                <td align="center" valign="middle" style="font-size:10px;color:#46464f;">NO IMAGE</td>
                                            </tr>
                                        </table>
                                    </a>
                                </td>
                                <td style="padding:14px;vertical-align:top;">
                                    <p style="margin:0 0 6px;font-size:14px;font-weight:600;color:#1b1b1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                                        <span th:text="${product.grade}"
                                              th:style="'display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;margin-right:6px;vertical-align:middle;background:#ffffff;border:1px solid ' + ${product.gradeColor} + ';color:' + ${product.gradeColor}">HG</span>
                                        <a th:href="${product.url}" th:text="${product.name}" target="_blank" style="color:#1b1b1f;text-decoration:none;vertical-align:middle;">제품명</a>
                                    </p>
                                    <p style="margin:0;font-size:13px;color:#46464f;">
                                        <span th:text="${product.priceLabel}">₩ 31,200</span>
                                        <span style="color:#c7c5d0;padding:0 6px;">·</span>
                                        <span th:text="${product.source}">출처</span>
                                        <span style="color:#c7c5d0;padding:0 6px;">·</span>
                                        <a th:href="${product.url}" target="_blank" style="color:#4a5cc4;">바로가기</a>
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <!-- 판매제품 모아보기 바로가기 -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                            <tr>
                                <td align="center" style="padding:14px 0 24px;">
                                    <a th:href="${baseUrl + '/on-sale'}" target="_blank"
                                       style="display:inline-block;background:#4a5cc4;color:#ffffff;text-decoration:none;
                                              font-size:15px;font-weight:600;padding:13px 32px;border-radius:100px;">판매제품 모아보기</a>
                                </td>
                            </tr>
                        </table>

                        <!-- 알림 설정 안내 -->
                        <p style="margin:0;font-size:12px;color:#46464f;text-align:center;">
                            이 알림을 그만 받고 싶다면 사이트 우측 상단 프로필 아이콘 → 알림 설정에서 끌 수 있습니다.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

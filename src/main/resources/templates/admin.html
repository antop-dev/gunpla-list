<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 관리 - 건담 목록</title>
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-grid.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-theme-alpine.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/css/all.min.css}">
</head>
<body>

<script th:inline="javascript">
    window.CONTEXT_PATH = /*[[@{/}]]*/ '/';
</script>

<!-- Korean messages hardcoded -->
<script>
    window.MESSAGES = {
        'product.category': '구분',
        'product.boxArt': '박스아트',
        'product.grade': '등급',
        'product.modelNumber': '형식번호',
        'product.name': '제품명',
        'product.releaseDate': '발매년월',
        'product.price': '출시가격',
        'product.actions': '액션',
        'action.add': '추가',
        'action.edit': '수정',
        'action.delete': '삭제',
        'action.save': '저장',
        'action.cancel': '취소',
        'action.search': '검색',
        'action.clear': '초기화',
        'action.upload': '이미지 업로드',
        'modal.product.add': '제품 추가',
        'modal.product.edit': '제품 수정',
        'modal.category.manage': '구분 관리',
        'confirm.delete': '정말로 삭제하시겠습니까?',
        'msg.success.save': '저장되었습니다.',
        'msg.success.delete': '삭제되었습니다.',
        'msg.error.required': '{0}은(는) 필수입니다.',
        'msg.error.server': '오류가 발생했습니다.',
        'filter.all': '전체',
        'currency.JPY': '엔화 (JPY)',
        'currency.KRW': '원화 (KRW)',
        'currency.CNY': '위안화 (CNY)',
        'currency.USD': '달러 (USD)',
        'currency.suffix.JPY': '엔',
        'currency.suffix.KRW': '원',
    };
</script>

<div class="admin-layout">
    <header th:replace="~{fragments/admin-header :: adminHeader('제품 관리', 'products', ~{::.page-actions})}">
        <div class="page-actions">
            <button id="btn-add-product" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-plus"></i> 추가
            </button>
            <button id="btn-manage-categories" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-tags"></i> 구분 관리
            </button>
            <button id="btn-image-trim-tool" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-crop-simple"></i> 이미지 여백 제거
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="admin-main">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <!-- 체크박스 항목은 그리드 컬럼 정의에서 만들어 채운다(admin.js) -->
                <div id="column-visibility" class="check-dropdown">
                    <button type="button" class="form-control check-dropdown-toggle"
                            aria-haspopup="true" aria-expanded="false">
                        <span>표시할 컬럼</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="check-dropdown-menu" hidden></div>
                </div>
            </div>
            <div class="toolbar-right">
                <select id="search-grade" class="form-control search-select">
                    <option value="">등급 전체</option>
                    <option value="HG">HG</option>
                    <option value="RG">RG</option>
                    <option value="MG">MG</option>
                    <option value="MGSD">MGSD</option>
                    <option value="MGEX">MGEX</option>
                    <option value="PG">PG</option>
                    <option value="OTHER">기타</option>
                </select>
                <select id="search-category" class="form-control search-select">
                    <option value="">구분 전체</option>
                </select>
                <input type="text" id="search-model" class="form-control search-input" placeholder="형식번호">
                <input type="text" id="search-name" class="form-control search-input" placeholder="제품명">
                <input type="text" id="search-series" class="form-control search-input" placeholder="출연작">
                <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm" title="새로고침" aria-label="새로고침">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-container">
            <div id="products-grid" class="ag-theme-alpine-dark" style="width:100%;height:100%"></div>
        </div>
    </main>
</div>

<!-- Product Modal (fragments/product-modal.html 공용) -->
<div th:replace="~{fragments/product-modal :: productModal}"></div>

<!-- Category Modal -->
<div id="modal-category" class="modal-overlay">
    <div class="modal category-modal">
        <div class="modal-header">
            <span class="modal-title">구분 관리</span>
            <button id="modal-category-close" class="modal-close">×</button>
        </div>
        <div class="modal-body category-modal-body">
            <div id="category-list" class="category-list"></div>
        </div>
        <div class="modal-footer">
            <input type="text" id="new-category-name" class="form-control" style="flex:1;min-width:0" placeholder="구분명">
            <input type="color" id="new-category-color" value="#6c757d" style="width:40px;height:32px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;padding:2px;flex-shrink:0">
            <button id="btn-category-add" class="btn btn-primary btn-sm">추가</button>
            <button id="btn-category-close" class="btn btn-secondary btn-sm">닫기</button>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox-overlay" class="lightbox-overlay">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Original">
</div>

<!-- Image Trim Tool Modal -->
<div id="modal-image-trim" class="modal-overlay">
    <div class="modal image-trim-modal">
        <div class="modal-header">
            <span class="modal-title">이미지 여백 제거</span>
            <button id="modal-image-trim-close" class="modal-close">×</button>
        </div>
        <div class="modal-body">
            <div id="image-trim-drop" class="image-trim-drop">
                <i class="fa-regular fa-image"></i>
                <span>이미지를 끌어놓거나, 붙여넣기(Ctrl+V) 하거나, 클릭해서 파일을 선택하세요</span>
                <input type="file" id="image-trim-file-input" accept="image/*" hidden>
            </div>
        </div>
    </div>
</div>

<!-- Image Trim Processing Overlay -->
<div id="image-trim-processing" class="image-trim-processing-overlay">
    <i class="fa-solid fa-spinner fa-spin"></i>
</div>

<div th:replace="~{fragments/admin-header :: adminPasswordModal}"></div>

<script th:src="@{/vendor/ag-grid/ag-grid-community.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin-header.js}"></script>
<script th:src="@{/js/product-modal.js}"></script>
<script th:src="@{/js/image-trim-tool.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>

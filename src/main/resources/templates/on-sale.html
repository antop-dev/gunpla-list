<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매제품 모아보기 - 건담 목록</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192"  th:href="@{/favicon/android-icon-192x192.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/favicon/favicon-96x96.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon/favicon-16x16.png}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-grid.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-theme-alpine.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/tom-select/tom-select.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/css/all.min.css}">
    <th:block th:if="${not #strings.isEmpty(ga4)}">
        <script th:src="@{https://www.googletagmanager.com/gtag/js(id=${ga4})}" async="async"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', /*[[${ga4}]]*/ '');
        </script>
    </th:block>
    <!-- Google Tag Manager -->
    <th:block th:if="${not #strings.isEmpty(gtmId)}">
        <script th:inline="javascript">
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer',/*[[${gtmId}]]*/ '');
        </script>
    </th:block>
    <!-- End Google Tag Manager -->
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<th:block th:if="${not #strings.isEmpty(gtmId)}">
    <noscript>
        <iframe th:src="'https://www.googletagmanager.com/ns.html?id=' + ${gtmId}"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
</th:block>
<!-- End Google Tag Manager (noscript) -->

<script th:inline="javascript">
    window.CONTEXT_PATH = /*[[@{/}]]*/ '/';
    window.LOGGED_IN = /*[[${loggedIn}]]*/ false;
</script>

<div class="user-layout">
    <header th:replace="~{fragments/user-header :: userHeader('on-sale', '판매제품 모아보기', ~{})}"></header>

    <!-- Main -->
    <main class="user-main">
        <!-- Toolbar — 왼쪽: 제품별 알림 일괄 액션(로그인 시), 오른쪽: 검색 -->
        <div class="toolbar toolbar-split">
            <div class="toolbar-left">
                <th:block th:if="${loggedIn}">
                    <button id="btn-alert-on" type="button" class="btn btn-primary btn-sm" disabled
                            title="체크한 제품이 새로 판매중이 되면 이메일로 알려드립니다 (설정에서 알림을 켜고 해당 등급을 고른 경우에만)">
                        <i class="fa-solid fa-bell"></i> 알림 받기
                    </button>
                    <button id="btn-alert-off" type="button" class="btn btn-secondary btn-sm" disabled>
                        <i class="fa-regular fa-bell-slash"></i> 알림 해제
                    </button>
                    <span id="selected-count" class="toolbar-selected-count"></span>
                </th:block>
            </div>
            <div class="toolbar-right">
                <select id="search-source" class="search-multi search-multi-wide" multiple aria-label="출처 필터" data-placeholder="출처 전체">
                    <option value="반다이남코코리아몰">반다이남코코리아몰</option>
                    <option value="네이버+ 스토어">네이버+ 스토어</option>
                    <option value="PREMIUM BANDAI">PREMIUM BANDAI</option>
                </select>
                <select id="search-grade" class="search-multi search-multi-wide" multiple aria-label="등급 필터" data-placeholder="등급 전체">
                    <option value="HG">HG</option>
                    <option value="RG">RG</option>
                    <option value="MG">MG</option>
                    <option value="MGSD">MGSD</option>
                    <option value="MGEX">MGEX</option>
                    <option value="PG">PG</option>
                    <option value="RE">RE</option>
                </select>
                <input type="text" id="search-name" class="form-control search-input" placeholder="제품명" aria-label="제품명 검색">
                <select id="search-status" class="form-control search-select" aria-label="상태 필터">
                    <option value="">상태 전체</option>
                    <option value="판매중" selected>판매중</option>
                    <option value="품절">품절</option>
                </select>
                <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm" title="새로고침" aria-label="새로고침">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-container">
            <div id="on-sale-grid" class="ag-theme-alpine-dark" style="width:100%;height:100%"></div>
        </div>
    </main>
</div>

<!-- Lightbox -->
<div id="lightbox-overlay" class="lightbox-overlay">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Original">
</div>

<th:block th:replace="~{fragments/user-header :: userHeaderModals}"></th:block>

<script th:src="@{/vendor/ag-grid/ag-grid-community.min.js}"></script>
<script th:src="@{/vendor/tom-select/tom-select.complete.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/user-header.js}"></script>
<script th:src="@{/js/on-sale.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매제품 모아보기 - 건담 목록</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192"  th:href="@{/favicon/android-icon-192x192.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/favicon/favicon-96x96.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon/favicon-16x16.png}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-grid.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-theme-alpine.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/css/all.min.css}">
    <th:block th:if="${not #strings.isEmpty(ga4)}">
        <script th:src="@{https://www.googletagmanager.com/gtag/js(id=${ga4})}" async="async"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', /*[[${ga4}]]*/ '');
        </script>
    </th:block>
    <!-- Google Tag Manager -->
    <th:block th:if="${not #strings.isEmpty(gtmId)}">
        <script th:inline="javascript">
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer',/*[[${gtmId}]]*/ '');
        </script>
    </th:block>
    <!-- End Google Tag Manager -->
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<th:block th:if="${not #strings.isEmpty(gtmId)}">
    <noscript>
        <iframe th:src="'https://www.googletagmanager.com/ns.html?id=' + ${gtmId}"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
</th:block>
<!-- End Google Tag Manager (noscript) -->

<script th:inline="javascript">
    window.CONTEXT_PATH = /*[[@{/}]]*/ '/';
</script>

<div class="user-layout">
    <!-- Header -->
    <header class="user-header">
        <div class="user-header-brand">
            <img th:src="@{/favicon/favicon-32x32.png}" alt="" width="20" height="20">
            판매제품 모아보기
        </div>
        <div class="user-header-actions">
            <a th:href="@{/}" class="btn btn-secondary btn-sm gtm-header-product-list">
                <i class="fa-solid fa-list"></i> 제품 목록
            </a>
        </div>
    </header>

    <!-- Main -->
    <main class="user-main">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <select id="search-source" class="form-control search-select" aria-label="출처 필터">
                    <option value="">출처 전체</option>
                    <option value="반다이남코코리아몰">반다이남코코리아몰</option>
                    <option value="네이버+ 스토어">네이버+ 스토어</option>
                    <option value="PREMIUM BANDAI">PREMIUM BANDAI</option>
                </select>
                <select id="search-grade" class="form-control search-select" aria-label="등급 필터">
                    <option value="">등급 전체</option>
                    <option value="HG">HG</option>
                    <option value="RG">RG</option>
                    <option value="MG">MG</option>
                    <option value="PG">PG</option>
                </select>
                <input type="text" id="search-name" class="form-control search-input" placeholder="제품명" aria-label="제품명 검색">
                <select id="search-status" class="form-control search-select" aria-label="상태 필터">
                    <option value="">상태 전체</option>
                    <option value="판매중" selected>판매중</option>
                    <option value="품절">품절</option>
                </select>
                <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm" title="새로고침" aria-label="새로고침">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-container">
            <div id="on-sale-grid" class="ag-theme-alpine-dark" style="width:100%;height:100%"></div>
        </div>
    </main>
</div>

<!-- Lightbox -->
<div id="lightbox-overlay" class="lightbox-overlay">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Original">
</div>

<!-- 행 마우스오버 시 이미지 확대 미리보기 -->
<div id="hover-preview" class="hover-preview">
    <img id="hover-preview-img" src="" alt="preview">
</div>

<script th:src="@{/vendor/ag-grid/ag-grid-community.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/on-sale.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건담 목록</title>
    <!-- SEO: Primary -->
    <meta name="description" content="건담 프라모델(건프라) 목록을 조회하고 보유 현황을 기록하세요. HG, RG, MG, PG 등 다양한 건프라 제품 정보와 출시가격을 제공합니다.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" th:href="${baseUrl + '/'}">
    <!-- SEO: Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="건담 목록">
    <meta property="og:title" content="건담 목록">
    <meta property="og:description" content="건담 프라모델(건프라) 목록을 조회하고 보유 현황을 기록하세요. HG, RG, MG, PG 등 다양한 건프라 제품 정보와 출시가격을 제공합니다.">
    <meta property="og:url" th:content="${baseUrl + '/'}">
    <meta property="og:image" th:content="${baseUrl + '/favicon/android-icon-192x192.png'}">
    <meta property="og:locale" content="ko_KR">
    <!-- SEO: Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="건담 목록">
    <meta name="twitter:description" content="건담 프라모델(건프라) 목록을 조회하고 보유 현황을 기록하세요. HG, RG, MG, PG 등 다양한 건프라 제품 정보와 출시가격을 제공합니다.">
    <meta name="twitter:image" th:content="${baseUrl + '/favicon/android-icon-192x192.png'}">
    <!-- SEO: JSON-LD -->
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "건담 목록",
      "url": /*[[${baseUrl}]]*/ "",
      "description": "건담 프라모델(건프라) 목록을 조회하고 보유 현황을 기록하세요. HG, RG, MG, PG 등 다양한 건프라 제품 정보와 출시가격을 제공합니다."
    }
    </script>
    <link rel="icon" type="image/png" sizes="192x192"  th:href="@{/favicon/android-icon-192x192.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/favicon/favicon-96x96.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon/favicon-16x16.png}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-grid.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/ag-grid/ag-theme-alpine.min.css}">
    <link rel="stylesheet" th:if="${loggedIn}" th:href="@{/vendor/tom-select/tom-select.min.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
    <link rel="stylesheet" th:href="@{/vendor/font-awesome/css/all.min.css}">
    <!-- 이미 본 안내(data-hint)를 화면이 그려지기 전에 꺼야 하므로 head 에서 읽는다 -->
    <script th:src="@{/js/rainbow-hint.js}"></script>
    <th:block th:if="${not #strings.isEmpty(ga4)}">
        <script th:src="@{https://www.googletagmanager.com/gtag/js(id=${ga4})}" async="async"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', /*[[${ga4}]]*/ '');
        </script>
    </th:block>
    <!-- Google Tag Manager -->
    <th:block th:if="${not #strings.isEmpty(gtmId)}">
        <script th:inline="javascript">
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer',/*[[${gtmId}]]*/ '');
        </script>
    </th:block>
    <!-- End Google Tag Manager -->
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<th:block th:if="${not #strings.isEmpty(gtmId)}">
    <noscript>
        <iframe th:src="'https://www.googletagmanager.com/ns.html?id=' + ${gtmId}"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
</th:block>
<!-- End Google Tag Manager (noscript) -->

<script th:inline="javascript">
    window.USER_LOGGED_IN = /*[[${loggedIn}]]*/ false;
    window.USER_PICTURE = /*[[${userPicture}]]*/ null;
    window.CONTEXT_PATH = /*[[@{/}]]*/ '/';
</script>

<div class="user-layout">
    <header th:replace="~{fragments/user-header :: userHeader('products', '건담 목록', ~{::#view-mode-toggle})}">
        <div class="view-mode-toggle" id="view-mode-toggle">
            <button class="mode-btn active gtm-header-view-normal" data-mode="normal">일반</button>
            <button class="mode-btn gtm-header-view-tab" data-mode="tab">탭</button>
        </div>
    </header>

    <main class="user-main">
        <!-- Toolbar -->
        <div class="toolbar">
            <!-- 모바일 전용: 통합 검색 인풋 (등급/형식번호/제품명) -->
            <input type="text" id="search-keyword-mobile"
                   class="form-control user-search-mobile"
                   placeholder="형식번호/제품명" autocomplete="off"
                   aria-label="형식번호/제품명 검색">
            <div class="toolbar-right">
                <select id="search-grade" class="form-control search-select user-search-pc" aria-label="등급 필터">
                    <option value="">등급 전체</option>
                    <option value="HG">HG</option>
                    <option value="RG">RG</option>
                    <option value="MG">MG</option>
                    <option value="MGSD">MGSD</option>
                    <option value="MGEX">MGEX</option>
                    <option value="PG">PG</option>
                    <option value="RE">RE</option>
                    <option value="OTHER">기타</option>
                </select>
                <select id="search-category" class="form-control search-select user-search-pc" aria-label="구분 필터">
                    <option value="">구분 전체</option>
                </select>
                <input type="text" id="search-model" class="form-control search-input user-search-pc"
                       placeholder="형식번호" autocomplete="off" aria-label="형식번호 검색">
                <input type="text" id="search-name" class="form-control search-input user-search-pc"
                       placeholder="제품명" autocomplete="off" aria-label="제품명 검색">
                <input type="text" id="search-series" class="form-control search-input user-search-pc"
                       placeholder="출연작" autocomplete="off" aria-label="출연작 검색">
                <select id="search-owned" class="form-control search-select user-search-pc"
                        th:if="${loggedIn}" aria-label="보유 여부 필터">
                    <option value="">전체</option>
                    <option value="true">보유</option>
                    <option value="false">미보유</option>
                </select>
                <button id="btn-refresh" type="button" class="btn btn-ghost btn-sm gtm-toolbar-refresh" title="새로고침" aria-label="새로고침">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid-area">
            <div class="grid-container">
                <div id="products-grid" class="ag-theme-alpine-dark" style="width:100%;height:100%"></div>
            </div>
            <div class="grade-tabs" id="grade-tabs">
                <button class="grade-tab active gtm-grade-tab" data-grade="" data-gtm-grade="">전체</button>
                <button class="grade-tab gtm-grade-tab" data-grade="HG" data-gtm-grade="HG">HG</button>
                <button class="grade-tab gtm-grade-tab" data-grade="RG" data-gtm-grade="RG">RG</button>
                <button class="grade-tab gtm-grade-tab" data-grade="MG" data-gtm-grade="MG">MG</button>
                <button class="grade-tab gtm-grade-tab" data-grade="MGSD" data-gtm-grade="MGSD">MGSD</button>
                <button class="grade-tab gtm-grade-tab" data-grade="MGEX" data-gtm-grade="MGEX">MGEX</button>
                <button class="grade-tab gtm-grade-tab" data-grade="PG" data-gtm-grade="PG">PG</button>
                <button class="grade-tab gtm-grade-tab" data-grade="RE" data-gtm-grade="RE">RE</button>
            </div>
        </div>
    </main>

</div>


<!-- Detail popup -->
<div id="modal-detail" class="modal-overlay gtm-modal-detail-backdrop">
    <div class="modal detail-modal">
        <div class="modal-header">
            <span class="modal-title">제품 상세</span>
            <button id="modal-detail-close" class="modal-close gtm-modal-detail-close" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="detail-product-info">
                <div class="detail-boxart" id="detail-boxart"></div>
                <table class="detail-table" id="detail-table"></table>
            </div>
        </div>
        <div class="modal-footer" th:if="${loggedIn}">
            <button id="btn-detail-modify-request" class="btn btn-secondary btn-sm gtm-modal-detail-modify-request rainbow-border"
                    data-hint="modify-request">
                <i class="fa-solid fa-pen-to-square"></i> 수정 요청
            </button>
        </div>
    </div>
</div>

<!-- 제품 등록/수정 요청 팝업 — 어드민 제품 추가/수정과 같은 폼을 요청 모드로 사용 -->
<div th:if="${loggedIn}" th:replace="~{fragments/product-modal :: productModal}"></div>

<th:block th:replace="~{fragments/user-header :: userHeaderModals}"></th:block>

<!-- Lightbox -->
<div id="lightbox-overlay" class="lightbox-overlay gtm-lightbox-close">
    <div id="lightbox-spinner" class="lightbox-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
    <img id="lightbox-img" class="lightbox-img" src="" alt="Original" style="display:none">
</div>

<script th:src="@{/vendor/ag-grid/ag-grid-community.min.js}"></script>
<script th:if="${loggedIn}" th:src="@{/vendor/tom-select/tom-select.complete.min.js}"></script>
<script th:src="@{/js/common.js(v=${T(java.util.UUID).randomUUID()})}"></script>
<script th:if="${loggedIn}" th:src="@{/js/product-modal.js(v=${T(java.util.UUID).randomUUID()})}"></script>
<script th:src="@{/js/user-header.js(v=${T(java.util.UUID).randomUUID()})}"></script>
<script th:src="@{/js/user.js(v=${T(java.util.UUID).randomUUID()})}"></script>
</body>
</html>

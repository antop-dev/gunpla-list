<!--/* 사용자 사이트 공통 헤더 — 제품 목록(/), 판매제품 모아보기(/on-sale), 요청 현황(/my/product-requests)이 같은 헤더/로그인/설정/공유를 쓰도록 한 곳에서 관리
     page      : 현재 페이지 키 (products / on-sale / my-requests) — 페이지 이동 버튼과 '제품 등록' 노출을 정한다
     title     : 브랜드 옆 제목
     brandExtra: 제목 옆에 붙일 페이지 전용 요소 fragment — 없으면 ~{} 를 넘긴다
     모델 속성 loggedIn / userPicture 가 필요하다 (UserPageController, OnSalePageController)
     설정/공유 팝업과 로그아웃 폼은 userHeaderModals fragment 로 함께 포함하고, 동작은 /js/user-header.js 가 담당
     (설정 팝업의 등급 선택에 Tom Select 를 쓰므로 로그인 시 tom-select 스크립트/스타일도 로드해야 한다) */-->
    <header xmlns:th="http://www.thymeleaf.org" th:fragment="userHeader(page, title, brandExtra)" class="user-header">
        <div class="user-header-brand">
            <img th:src="@{/favicon/favicon-32x32.png}" alt="" width="20" height="20">
            <span class="user-header-title" th:text="${title}">건담 목록</span>
            <th:block th:replace="${brandExtra}"></th:block>
            <div class="header-links">
                <a href="https://github.com/antop-dev/gunpla-list" target="_blank" rel="noopener noreferrer" class="gtm-header-github">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="https://p.antop.ai/supports?project=gunpla-list" target="_blank" rel="noopener noreferrer" class="gtm-header-feedback">
                    <i class="fa-solid fa-comment-dots"></i> 피드백
                </a>
                <a href="https://ko-fi.com/antop?hidefeed=true&amp;widget=true" target="_blank" rel="noopener noreferrer" class="gtm-header-donate rainbow-text">
                    <i class="fa-solid fa-mug-hot"></i> Donate
                </a>
            </div>
        </div>
        <div class="user-header-actions">
            <!-- 제품 등록은 제품 등록 팝업(ProductModal)이 있는 제품 목록 페이지에서만 -->
            <button th:if="${loggedIn and page == 'products'}" id="btn-product-request" type="button"
                    class="btn btn-secondary btn-sm gtm-header-product-request user-header-request-btn rainbow-border"
                    data-hint="product-request">
                <i class="fa-solid fa-plus"></i> <span class="btn-label">제품 등록</span>
            </button>
            <a th:if="${loggedIn and page != 'my-requests'}" th:href="@{/my/product-requests}"
               class="btn btn-secondary btn-sm gtm-header-my-requests user-header-request-btn">
                <i class="fa-solid fa-clipboard-list"></i> <span class="btn-label">요청 현황</span>
            </a>
            <a th:if="${page != 'on-sale'}" th:href="@{/on-sale}"
               class="btn btn-secondary btn-sm gtm-header-on-sale user-header-onsale-link">
                <i class="fa-solid fa-store"></i> 판매제품 모아보기
            </a>
            <a th:if="${page != 'products'}" th:href="@{/}"
               class="btn btn-secondary btn-sm gtm-header-product-list user-header-onsale-link">
                <i class="fa-solid fa-list"></i> 제품 목록
            </a>
            <!-- 로그인 후 지금 보던 페이지로 돌아오도록 redirect 를 넘긴다 (UserLoginController) -->
            <a th:if="${!loggedIn}"
               th:href="@{/login/google(redirect=${page == 'on-sale' ? '/on-sale' : '/'})}"
               class="btn-google-signin gtm-header-login">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                </svg>
                <span class="btn-google-signin-label">Google 로그인</span>
            </a>
            <div th:if="${loggedIn}" class="header-account">
                <!-- 공유 — 설정에서 "보유상품 공유 허용"을 켠 경우에만 활성화된다 (user-header.js updateShareButton) -->
                <button class="btn-header-icon gtm-header-share" id="btn-share" disabled
                        title="설정에서 보유상품 공유를 허용하세요" aria-label="보유상품 공유">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button class="btn-header-icon gtm-header-settings" id="btn-settings"
                        title="설정" aria-label="설정">
                    <i class="fa-solid fa-gear"></i>
                    <span class="notify-badge notify-badge-off" id="notify-badge"></span>
                </button>
                <button class="btn-profile-name gtm-header-logout" id="btn-profile" title="로그아웃" aria-label="로그아웃">
                    <img th:if="${userPicture != null}" th:src="${userPicture}" alt="profile" class="profile-avatar">
                    <i th:if="${userPicture == null}" class="fa-solid fa-user profile-avatar-fallback"></i>
                </button>
            </div>
        </div>
    </header>

<!--/* 설정/공유 팝업 + 로그아웃 폼 — userHeader 와 함께 포함한다 */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="userHeaderModals">
<!-- Hidden logout form -->
<form id="form-logout" th:action="@{/logout}" method="post" style="display:none"></form>

<!-- 설정 팝업 — 영역(.settings-section)별로 설정을 묶는다. 설정이 늘어나면 영역을 추가한다 -->
<div th:if="${loggedIn}" id="modal-settings" class="modal-overlay gtm-modal-settings-backdrop">
    <div class="modal" style="width:380px">
        <div class="modal-header">
            <span class="modal-title">설정</span>
            <button id="modal-settings-close" class="modal-close gtm-modal-settings-close" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <section class="settings-section">
                <h3 class="settings-section-title">보유상품 공유</h3>
                <label class="notification-checkbox">
                    <input type="checkbox" id="field-share-enabled">
                    보유상품 공유 허용
                </label>
                <p class="notification-hint">허용하면 공유 링크를 아는 누구나 내 보유 제품 목록을 볼 수 있습니다.</p>
            </section>
            <section class="settings-section">
                <h3 class="settings-section-title">신규 판매제품 알림</h3>
                <label class="notification-checkbox">
                    <input type="checkbox" id="field-notify-on-sale">
                    신규 판매제품 알림 받기
                </label>
                <div class="form-group" style="margin-top:14px">
                    <label class="form-label" for="field-notify-email">이메일 주소</label>
                    <input type="email" id="field-notify-email" class="form-control" placeholder="you@example.com" autocomplete="off">
                </div>
                <div class="form-group" style="margin-top:14px">
                    <label class="form-label" for="field-notify-grades">알림 받을 등급</label>
                    <!-- 옵션은 NotificationSettingsService.NOTIFY_GRADES 와 맞춘다 — 선택하지 않으면 메일을 보내지 않는다 -->
                    <select id="field-notify-grades" class="search-multi notify-grades" multiple aria-label="알림 받을 등급" data-placeholder="등급 선택">
                        <option value="HG">HG</option>
                        <option value="RE">RE</option>
                        <option value="RG">RG</option>
                        <option value="MG">MG</option>
                        <option value="MGSD">MGSD</option>
                        <option value="MGEX">MGEX</option>
                        <option value="PG">PG</option>
                    </select>
                    <p class="notification-hint">알림을 받으려면 등급을 하나 이상 선택하세요.</p>
                    <p class="notification-hint">선택한 등급의 제품이 새로 판매중이 되면 알려드립니다. 판매제품 모아보기에서 알림을 끈 제품은 제외됩니다.</p>
                </div>
            </section>
        </div>
        <div class="modal-footer">
            <button id="btn-settings-save" class="btn btn-primary btn-sm gtm-modal-settings-save">저장</button>
            <button id="btn-settings-cancel" class="btn btn-secondary btn-sm gtm-modal-settings-cancel">닫기</button>
        </div>
    </div>
</div>

<!-- 공유 팝업 — 공유 URL 안내 + 복사 -->
<div th:if="${loggedIn}" id="modal-share" class="modal-overlay gtm-modal-share-backdrop">
    <div class="modal" style="width:420px">
        <div class="modal-header">
            <span class="modal-title">공유하기</span>
            <button id="modal-share-close" class="modal-close gtm-modal-share-close" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <p class="share-guide">아래 링크로 내 보유 제품 목록을 공유할 수 있습니다.</p>
            <div class="share-url-row">
                <input type="text" id="field-share-url" class="form-control" readonly aria-label="공유 URL">
                <button id="btn-share-copy" class="btn btn-primary btn-sm gtm-modal-share-copy"
                        title="복사하기" aria-label="복사하기">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
        </div>
    </div>
</div>
</th:block>

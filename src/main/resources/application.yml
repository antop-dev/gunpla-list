spring:
  application:
    name: gunpla-list

  datasource:
    url: jdbc:sqlite:${app.db-path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 는 동시 쓰기가 1개만 가능하므로 커넥션 풀을 1로 제한한다.
      maximum-pool-size: 1
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 V1~V11이 적용된 DB에서 flyway_schema_history 테이블이 없을 때
    # V11을 베이스라인으로 표시하고 V12부터만 실행
    baseline-on-migrate: true
    baseline-version: 11
    # 마이그레이션 파일에 주석을 추가하면 체크섬이 달라지므로, 체크섬 검증을 비활성화
    validate-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - profile
              - email

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    # SMTP 서버. 비어 있으면 신규 판매제품 알림 메일 발송을 건너뛴다(운영 값은 배포 워크플로가 준다)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    # SMTP 로그인 계정. 비어 있으면 메일 발송을 건너뛴다. Resend 는 고정 문자열 'resend' 가 계정, API 키가 비밀번호다
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # SMTP 인증. TLS 를 지원하지 않는 로컬 더미 SMTP(mailpit 등)는 보통 인증도 없으므로 함께 끈다
          auth: ${MAIL_AUTH:true}
          ssl:
            protocols: TLSv1.2 TLSv1.3
            checkserveridentity: true
        transport:
          protocol: smtp

server:
  port: 10002
  forward-headers-strategy: framework
  servlet:
    context-path: /gunpla-list
    session:
      timeout: -1s

app:
  db-path: ${DB_PATH:./data/gunpla-list.db}
  base-url: http://localhost:8080
  box-art:
    original-directory: ${BOX_ART_ORIGINAL_DIRECTORY:./data/boxart/original}
    thumbnail-directory: ${BOX_ART_THUMBNAIL_DIRECTORY:./data/boxart/thumbnail}
  mail:
    # SMTP 연결 암호화 방식. starttls(587 기본) / ssl(465 암시적 TLS) / none(평문, 로컬 더미 SMTP 전용)
    tls: ${MAIL_TLS:starttls}
    # 받는 사람에게 보이는 발신 주소. 비어 있으면 SMTP 계정(spring.mail.username)을 쓴다
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:}
    reply-to: ${MAIL_REPLY_TO:}

cage:
  session-key: ${CAGE_SESSION_KEY:CAGE_TOKEN}

# 단축 URL 서비스 — 값이 비어 있으면 단축 없이 원본 URL 을 그대로 저장한다
shorty:
  url:
  client-key:
